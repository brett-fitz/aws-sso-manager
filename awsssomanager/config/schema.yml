# How AWS accepts your sign-in:
#   identity-center (default): AWS IAM Identity Center, <ssoDomain>.awsapps.com/start
#   saml: SAML 2.0 federation into IAM roles via any IdP's AWS app (Okta, Entra ID, Google, ...)
provider: enum('identity-center', 'saml', required=False)

# provider: identity-center -> required. Your Identity Center domain (<ssoDomain>.awsapps.com).
ssoDomain: str(required=False)

# provider: identity-center -> required; the region Identity Center lives in.
# provider: saml -> optional; the STS region (default us-east-1).
region: str(required=False)

# provider: saml settings
saml: include('saml_settings', required=False)

# device info (generated by aws-sso-manager, provider: identity-center)
device: include('device_info', required=False)

# account or profile to copy into the `default` profile
default: include('default_settings', required=False)

# role priority for <account_id> / <account_name> profiles, lowest to highest
role_priority: list(str(), required=False)

# which roles get profiles, and what they are called
profiles: include('profile_settings', required=False)

---
saml_settings:
  appUrl: str()
  sessionDuration: int(min=900, max=43200, required=False)
  browser: enum('chrome', 'chrome-beta', 'msedge', 'chromium', required=False)
  timeout: int(min=30, required=False)

device_info:
  accessToken: str(required=False)
  accessTokenExpiresAt: str(required=False)
  clientId: str(required=False)
  clientSecret: str(required=False)
  clientSecretExpiresAt: str(required=False)
  deviceCode: str(required=False)

default_settings:
  loginAccount: any(str(), int(), required=False)

profile_settings:
  easyProfiles: bool(required=False)
  include: list(include('profile_rule'), required=False)
  exclude: list(include('profile_rule'), required=False)

profile_rule:
  account: any(str(), int(), required=False)
  role: str(required=False)
  name: str(required=False)
